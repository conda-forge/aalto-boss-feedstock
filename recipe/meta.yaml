{% set name = "aalto-boss" %}
{% set version = "1.15.2" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: d1d4fddb1850cb5b4fcbce2904ac977e7eb3a76d75d6ee1a041d4217136c1266

build:
  entry_points:
    - boss=boss.__main__:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - scipy >=1.8
    - python >={{ python_min }}
    - numpy >=1.20
    - gpy >=1.13.1
    - scipy <1.12.0,>=1.3.0
    - matplotlib-base >=3.5

test:
  imports:
    - boss
  commands:
    - pip check
    - boss --help
  requires:
    - pip
    - cython
    - python {{ python_min }}

about:
  home: https://gitlab.com/cest-group/boss
  summary: Bayesian optimization structure search
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jan-janssen
